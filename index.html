<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="description" content="Cuentas, presupuesto, metas de ahorro y préstamos. Tus datos se quedan en tu dispositivo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Mis Finanzas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: iOS-style app shell. Sidebar on wide screens, translucent tab bar on phones; inset-grouped lists, large titles, bottom sheets. */
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --sheet-bg: #f2f2f7;
    --sheet-card: #ffffff;
    --fill: rgba(120, 120, 128, .12);
    --fill-2: rgba(120, 120, 128, .2);
    --label: #000000;
    --label-2: rgba(60, 60, 67, .6);
    --label-3: rgba(60, 60, 67, .3);
    --sep: rgba(60, 60, 67, .2);
    --bar: rgba(249, 249, 249, .88);
    --seg-on: #ffffff;
    --tint: #007aff;
    --tint-soft: rgba(0, 122, 255, .12);
    --pos: #248a3d;
    --neg: #d70015;
    --c-blue: #007aff; --c-green: #34c759; --c-orange: #ff9500; --c-red: #ff3b30; --c-purple: #af52de;
    --c-pink: #ff2d55; --c-teal: #30b0c7; --c-indigo: #5856d6; --c-brown: #a2845e; --c-gray: #8e8e93;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    --font-d: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    --font-r: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --card: #1c1c1e; --sheet-bg: #1c1c1e; --sheet-card: #2c2c2e;
      --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .36);
      --label: #ffffff; --label-2: rgba(235, 235, 245, .6); --label-3: rgba(235, 235, 245, .3); --sep: rgba(84, 84, 88, .65);
      --bar: rgba(22, 22, 24, .88); --seg-on: #636366; --tint: #0a84ff; --tint-soft: rgba(10, 132, 255, .2);
      --pos: #30d158; --neg: #ff453a;
      --c-blue: #0a84ff; --c-green: #30d158; --c-orange: #ff9f0a; --c-red: #ff453a; --c-purple: #bf5af2;
      --c-pink: #ff375f; --c-teal: #40c8e0; --c-indigo: #5e5ce6; --c-brown: #ac8e68; --c-gray: #8e8e93;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --sheet-bg: #1c1c1e; --sheet-card: #2c2c2e;
    --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .36);
    --label: #ffffff; --label-2: rgba(235, 235, 245, .6); --label-3: rgba(235, 235, 245, .3); --sep: rgba(84, 84, 88, .65);
    --bar: rgba(22, 22, 24, .88); --seg-on: #636366; --tint: #0a84ff; --tint-soft: rgba(10, 132, 255, .2);
    --pos: #30d158; --neg: #ff453a;
    --c-blue: #0a84ff; --c-green: #30d158; --c-orange: #ff9f0a; --c-red: #ff453a; --c-purple: #bf5af2;
    --c-pink: #ff375f; --c-teal: #40c8e0; --c-indigo: #5e5ce6; --c-brown: #ac8e68; --c-gray: #8e8e93;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--label); font: 17px/1.35 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  h1, h2, h3, p, dl, dd { margin: 0; }
  h1, h2, h3 { text-wrap: balance; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--tint); outline-offset: 2px; border-radius: 6px; }
  .tab-num, .amt, .big, .v, td { font-variant-numeric: tabular-nums; }

  /* Shell */
  .side { display: none; }
  .main { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .content { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 32px; display: grid; gap: 22px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); padding: 6px max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
  .tab { background: none; border: 0; display: grid; justify-items: center; gap: 2px; color: var(--label-2); font: 500 10px/1.2 var(--font); padding: 4px 0; cursor: pointer; position: relative; }
  .tab svg { width: 26px; height: 26px; }
  .tab.on { color: var(--tint); }
  @media (min-width: 900px) {
    .app { display: grid; grid-template-columns: 250px minmax(0, 1fr); }
    .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 22px 12px 18px max(12px, env(safe-area-inset-left, 0px)); border-right: .5px solid var(--sep); background: var(--card); }
    .tabbar { display: none; }
    .main { padding-bottom: 0; }
    .content { padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; }
  }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 20px var(--font-d); padding: 0 10px 16px; }
  .brand-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(160deg, #3a9bff, #0060df); color: #fff; font: 700 17px var(--font-r); }
  .nav-i { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; border-radius: 10px; padding: 9px 10px; font: 500 15px var(--font); color: var(--label); cursor: pointer; text-align: left; }
  .nav-i svg { width: 22px; height: 22px; color: var(--tint); }
  .nav-i:hover { background: var(--fill); }
  .nav-i.on { background: var(--tint); color: #fff; }
  .nav-i.on svg { color: #fff; }
  .side .spacer { flex: 1; }
  .dot { position: absolute; top: 2px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--c-orange); }
  .nav-i .dot { position: static; margin-left: auto; }

  /* Headers */
  .vh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .vh > div:first-child { min-width: 0; display: grid; gap: 2px; flex: 1 1 auto; }
  .eyebrow { font: 600 13px var(--font); color: var(--label-2); text-transform: uppercase; letter-spacing: .02em; }
  .lt { font: 700 34px/1.12 var(--font-d); letter-spacing: .01em; overflow-wrap: anywhere; }
  .sub { color: var(--label-2); font-size: 15px; }
  .vh-act { display: flex; gap: 10px; align-items: center; }
  .sh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .sh h2 { font: 700 22px var(--font-d); }
  .section { display: grid; gap: 0; min-width: 0; }
  .note { color: var(--label-2); font-size: 13px; padding: 6px 16px 0; }

  /* Buttons */
  .btn { background: var(--tint); color: #fff; border: 0; border-radius: 12px; padding: 13px 20px; font: 600 17px var(--font); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.small { font-size: 15px; padding: 7px 14px; border-radius: 999px; }
  .btn.tinted { background: var(--tint-soft); color: var(--tint); }
  .btn.block { width: 100%; }
  .btn.destructive { background: var(--card); color: var(--neg); }
  .sheet .btn.destructive { background: var(--sheet-card); }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--tint-soft); color: var(--tint); border: 0; display: grid; place-items: center; cursor: pointer; flex: none; position: relative; }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn .dot { top: 0; right: 0; }
  .link { background: none; border: 0; color: var(--tint); font: 400 17px var(--font); padding: 6px 0; cursor: pointer; }
  .link.strong { font-weight: 600; }
  .link.sm { font-size: 15px; }
  .back { display: inline-flex; align-items: center; gap: 2px; background: none; border: 0; color: var(--tint); font: 400 17px var(--font); padding: 4px 0; cursor: pointer; justify-self: start; }
  .back svg { width: 22px; height: 22px; }

  /* Cards & lists */
  .card { background: var(--card); border-radius: 16px; padding: 16px; min-width: 0; }
  .group { background: var(--card); border-radius: 12px; overflow: hidden; }
  .sheet .group { background: var(--sheet-card); }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px; position: relative; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; }
  .row:active { background: var(--fill); }
  .row + .row::before, .row + .frow::before, .frow + .frow::before, .frow + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 60px; border-top: .5px solid var(--sep); }
  .frow + .frow::before, .row.plain + .row::before { left: 16px; }
  .rt { display: grid; gap: 1px; min-width: 0; flex: 1; }
  .t1 { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t2 { font-size: 14px; color: var(--label-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amt { margin-left: auto; font-weight: 500; white-space: nowrap; text-align: right; }
  .amt small { display: block; font-size: 12px; font-weight: 400; color: var(--label-2); }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }
  .muted { color: var(--label-2); }
  .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 600 15px var(--font); flex: none; background: var(--c, var(--c-gray)); }
  .ic.sq { border-radius: 9px; }
  .ic svg { width: 20px; height: 20px; }
  .add-row { color: var(--tint); }
  .add-row .ic { background: var(--tint-soft); color: var(--tint); }
  .empty { background: var(--card); border-radius: 16px; padding: 28px 20px; text-align: center; color: var(--label-2); display: grid; gap: 10px; justify-items: center; }
  .empty strong { color: var(--label); font: 600 19px var(--font-d); }
  .empty .btn { margin-top: 4px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--card); border-radius: 14px; padding: 13px 15px; min-width: 0; }
  .stat .k { font: 500 13px var(--font); color: var(--label-2); }
  .stat .v { font: 600 22px/1.25 var(--font-r); overflow-wrap: anywhere; }
  .stat .s { font-size: 13px; color: var(--label-2); }
  @media (max-width: 599px) { .stats > .stat:last-child:nth-child(odd) { grid-column: 1 / -1; } }

  .hero { background: var(--card); border-radius: 20px; padding: 20px; display: grid; gap: 10px; }
  .hero .k { font: 600 15px var(--font); color: var(--label-2); }
  .hero .big { font: 700 46px/1.05 var(--font-r); letter-spacing: -.02em; overflow-wrap: anywhere; }
  .hero .hint { color: var(--label-2); }
  .hero .btn { justify-self: start; }
  .kv { display: grid; gap: 8px; margin-top: 6px; padding-top: 12px; border-top: .5px solid var(--sep); }
  .kv div { display: flex; justify-content: space-between; gap: 12px; }
  .kv dt { color: var(--label-2); }
  .kv dd { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }

  .bar { height: 8px; border-radius: 99px; background: var(--fill); overflow: hidden; }
  .bar.lg { height: 12px; }
  .bar > i { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--c-blue)); }
  .stack { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--fill); gap: 2px; }
  .stack > i { display: block; height: 100%; background: var(--c); }
  .legend { display: grid; gap: 8px; margin-top: 12px; }
  .legend div { display: flex; align-items: center; gap: 10px; }
  .legend b { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  .legend span { flex: 1; min-width: 0; }
  .legend em { font-style: normal; color: var(--label-2); font-variant-numeric: tabular-nums; }
  .legend strong { font-weight: 500; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
  .chart-row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .chart-row .legend { flex: 1 1 180px; margin: 0; }
  .donut { width: 150px; height: 150px; flex: none; }
  .donut .dk { fill: var(--label-2); font: 500 9px var(--font); }
  .donut .dv { fill: var(--label); font: 700 15px var(--font-r); }
  .bars { width: 100%; height: auto; display: block; }
  .bars text { fill: var(--label-2); font: 500 10px var(--font); }
  .bars line { stroke: var(--sep); stroke-width: .6; }
  .chart-key { display: flex; gap: 16px; font-size: 13px; color: var(--label-2); margin-top: 6px; }
  .chart-key b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; vertical-align: -1px; }

  .mnav { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 12px; padding: 6px; }
  .mnav strong { font: 600 17px var(--font); }
  .mnav .icon-btn { background: none; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mrow { gap: 6px; padding: 0 16px 0 6px; cursor: default; }
  .mrow:active { background: none; }
  .row + .mrow::before, .mrow + .row::before { left: 52px; }
  .row-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; background: none; border: 0; padding: 10px 0; min-height: 56px; text-align: left; cursor: pointer; }
  .row-main:active { opacity: .6; }
  .chk { width: 40px; height: 48px; flex: none; border: 0; background: none; padding: 0; display: grid; place-items: center; cursor: pointer; }
  .chk span { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--label-3); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
  .chk svg { width: 14px; height: 14px; }
  .chk.on span { background: var(--c-green); border-color: var(--c-green); color: #fff; }
  .frow input.switch { flex: none; width: 51px; height: 31px; padding: 0; border-radius: 99px; background: var(--fill-2); position: relative; cursor: pointer; appearance: none; -webkit-appearance: none; transition: background .2s; }
  .frow input.switch::before { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.08); transition: transform .2s; }
  .frow input.switch:checked { background: var(--c-green); }
  .frow input.switch:checked::before { transform: translateX(20px); }
  .filters select, .filters input { width: 100%; font: 400 16px var(--font); color: var(--label); background: var(--fill); border: 0; border-radius: 10px; padding: 9px 12px; min-width: 0; }
  @media (min-width: 760px) { .filters { grid-template-columns: 1fr 1fr 1fr 1.3fr; } .filters input { grid-column: auto; } }
  .totline { display: flex; gap: 16px; flex-wrap: wrap; font-size: 15px; color: var(--label-2); padding: 0 4px; }
  .totline b { color: var(--label); font-weight: 600; font-variant-numeric: tabular-nums; }
  .day-h { font: 600 13px var(--font); color: var(--label-2); text-transform: uppercase; letter-spacing: .02em; padding: 18px 16px 6px; display: flex; justify-content: space-between; }
  .day-h:first-child { padding-top: 0; }

  .steps { display: grid; gap: 0; }
  .step-ok .ic { background: var(--c-green); }

  .metas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; }
  .meta { background: var(--card); border-radius: 16px; padding: 14px; border: 0; text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: center; min-width: 0; }
  .meta svg { width: 54px; height: 54px; flex: none; }
  .meta .rt .t2 { white-space: normal; }
  .ring-t { fill: var(--label); font: 700 11px var(--font-r); }
  .guide { display: grid; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: .5px solid var(--sep); font-size: 15px; }
  .guide div { display: flex; justify-content: space-between; gap: 10px; }
  .guide div > span:last-child { white-space: nowrap; }
  .guide .ok { color: var(--pos); }
  .guide .bad { color: var(--neg); }

  .warn-box { background: var(--card); border-radius: 12px; padding: 12px 16px; font-size: 15px; color: var(--label-2); }

  /* Loans */
  .loans { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
  .loan { background: var(--card); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
  .chip { justify-self: start; font: 600 12px var(--font); color: var(--tint); background: var(--tint-soft); border-radius: 6px; padding: 3px 8px; }
  .loan h3 { font: 600 20px var(--font-d); overflow-wrap: anywhere; }
  .loan .big { font: 700 30px/1.1 var(--font-r); }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
  .facts dt { font-size: 13px; color: var(--label-2); }
  .facts dd { font-weight: 600; font-variant-numeric: tabular-nums; }
  .loan-actions { display: flex; gap: 10px; align-items: center; }
  .loan-actions .btn { flex: 1; }
  .g-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .g-pct { font: 700 38px/1.1 var(--font-r); color: var(--c-blue); }
  .warn-g .g-pct { color: var(--c-orange); }
  .g-track { position: relative; height: 34px; background: var(--fill); border-radius: 999px; overflow: hidden; margin-top: 12px; }
  .g-fill { height: 100%; width: 0; border-radius: 999px; background: var(--c-blue); transition: width .4s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; color: #fff; font-weight: 600; font-size: 15px; white-space: nowrap; }
  .warn-g .g-fill { background: var(--c-orange); }
  .g-fill.out span { position: absolute; top: 50%; transform: translateY(-50%); left: calc(var(--w) + 10px); color: var(--label); }
  .g-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--label-2); margin-top: 6px; }
  .card h3 { font: 600 20px var(--font-d); }
  .table-scroll { overflow: auto; max-height: 70vh; margin-top: 12px; border-radius: 10px; border: .5px solid var(--sep); }
  table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 15px; }
  thead th { position: sticky; top: 0; z-index: 1; background: var(--card); color: var(--label-2); font: 600 12px var(--font); text-transform: uppercase; letter-spacing: .03em; text-align: right; padding: 10px 12px; white-space: nowrap; border-bottom: .5px solid var(--sep); }
  thead th:nth-child(-n+2), tbody td:nth-child(-n+2) { text-align: left; }
  tbody td { padding: 7px 12px; border-bottom: .5px solid var(--sep); text-align: right; white-space: nowrap; }
  tbody td:first-child { color: var(--label-2); }
  tbody tr.pagado td { background: var(--tint-soft); }
  tbody tr.hoy td { border-bottom: 2px solid var(--tint); }
  tbody tr.fin td { color: var(--label-3); }
  td.int { color: var(--neg); }
  td.cap { color: var(--pos); }
  td.sal { font-weight: 600; }
  tfoot td { position: sticky; bottom: 0; background: var(--card); border-top: .5px solid var(--sep); padding: 10px 12px; font-weight: 600; text-align: right; white-space: nowrap; }
  tfoot td:first-child { text-align: left; }
  input.abono { width: 118px; text-align: right; font: 500 15px var(--font); padding: 6px 8px; border: 0; border-radius: 8px; background: var(--fill); color: var(--label); }
  input.abono.tiene { background: rgba(52, 199, 89, .18); color: var(--pos); font-weight: 600; }
  input.abono:disabled { opacity: .4; }
  .tlegend { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--label-2); }
  .tlegend i { width: 12px; height: 12px; border-radius: 3px; background: var(--tint-soft); display: inline-block; }

  /* Sheets */
  .sheet-wrap { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .38); display: flex; align-items: flex-end; justify-content: center; }

  function barras(meses) {
    const W = 340, H = 176, L = 40, R = 6, T = 10, B = 26, ph = H - T - B;
    const max = niceMax(Math.max(1, ...meses.flatMap((m) => [m.ing, m.gas])));
    const pw = (W - L - R) / meses.length, bw = Math.min(15, pw * 0.3);
    let g = '';
    [0, .5, 1].forEach((f) => { const y = (T + ph - f * ph).toFixed(1); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${(+y + 3.5).toFixed(1)}" text-anchor="end">${compact(max * f)}</text>`; });
    meses.forEach((m, i) => {
      const x0 = L + i * pw + pw / 2;
      [[m.ing, 'green', x0 - bw - 1.5], [m.gas, 'red', x0 + 1.5]].forEach(([v, c, x]) => {
        const h = v / max * ph;
        if (h > 0.4) g += `<rect x="${x.toFixed(1)}" y="${(T + ph - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" style="fill:var(--c-${c})"/>`;
      });
      g += `<text x="${x0.toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(mesCorto(m.ym))}</text>`;
    });
    return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos ${meses.length} meses">${g}</svg>`;
  }
  function anillo(p, color) {
    const R = 22, C = 2 * Math.PI * R, len = Math.max(0, Math.min(1, p)) * C;
    return `<svg viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="${R}" fill="none" style="stroke:var(--fill)" stroke-width="6"/><circle cx="27" cy="27" r="${R}" fill="none" style="stroke:var(--c-${color})" stroke-width="6" stroke-linecap="round" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 27 27)"/><text x="27" y="31" text-anchor="middle" class="ring-t">${Math.round(Math.min(1, p) * 100)}%</text></svg>`;
  }

  // ================= Componentes =================
  const encabezado = (titulo, eyebrow, acciones = '', sub = '') => `<header class="vh"><div>${eyebrow ? `<p class="eyebrow">${esc(eyebrow)}</p>` : ''}<h1 class="lt">${esc(titulo)}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div><div class="vh-act">${acciones}</div></header>`;
  const mnav = (act, ym) => `<div class="mnav"><button class="icon-btn" type="button" data-act="${act}" data-d="-1" aria-label="Mes anterior">${IC.izq}</button><strong>${esc(nombreMes(ym))}</strong><button class="icon-btn" type="button" data-act="${act}" data-d="1" aria-label="Mes siguiente">${IC.der}</button></div>`;
  const icCat = (c) => `<span class="ic" style="--c:var(--c-${c ? c.color : 'gray'})">${esc((c ? c.nombre : '?').charAt(0))}</span>`;
  const icCuenta = (c) => { const t = TIPOS_CUENTA[c.tipo]; return `<span class="ic sq" style="--c:var(--c-${t.c})">${IC[t.i]}</span>`; };
  const btnMas = (act, label) => `<button class="icon-btn" type="button" data-act="${act}" aria-label="${esc(label)}">${IC.plus}</button>`;

  // efecto de un movimiento sobre una cuenta (para saldos y saldo corrido)
  function efecto(x, id) {
    if (x.tipo === 'gasto') return x.cuentaId === id ? -x.monto : 0;
    if (x.tipo === 'ingreso') return x.cuentaId === id ? x.monto : 0;
    return (x.cuentaId === id ? -x.monto : 0) + (x.cuentaDestinoId === id ? x.monto : 0);
  }
  function filaMov(x, opt = {}) {
    const c = cat(x.categoriaId), cu = cuenta(x.cuentaId);
    let icono, titulo, sub, amt;
    if (x.tipo === 'transferencia') {
      const de = cuenta(x.cuentaDestinoId);
      icono = `<span class="ic" style="--c:var(--c-gray)">${IC.flechas}</span>`;
      titulo = x.nota || 'Transferencia';
      sub = (cu ? cu.nombre : '') + ' → ' + (de ? de.nombre : '');
      if (opt.cuenta) { const e = efecto(x, opt.cuenta); amt = `<span class="amt ${e > 0 ? 'pos' : ''}">${e > 0 ? '+' : '−'}${moneyAbs(x.monto)}`; }
      else amt = `<span class="amt muted">${moneyAbs(x.monto)}`;
    } else {
      const ing = x.tipo === 'ingreso';
      icono = icCat(c);
      titulo = x.nota || (c ? c.nombre : 'Sin categoría');
      sub = (x.nota && c ? c.nombre + ' · ' : '') + (cu ? cu.nombre : '');
      amt = `<span class="amt ${ing ? 'pos' : ''}">${ing ? '+' : '−'}${moneyAbs(x.monto)}`;
    }
    if (opt.run != null) amt += `<small class="${opt.run < -0.005 ? 'neg' : ''}">${money(opt.run)}</small>`;
    amt += '</span>';
    const chk = `<button class="chk ${x.posteado ? 'on' : ''}" type="button" data-act="postear" data-id="${x.id}" aria-pressed="${x.posteado ? 'true' : 'false'}" aria-label="${x.posteado ? 'Posteado en el banco. Toca para marcar pendiente' : 'Pendiente en el banco. Toca para marcar posteado'}"><span>${IC.check}</span></button>`;
    return `<div class="row mrow ${x.posteado ? '' : 'pend'}">${chk}<button class="row-main" type="button" data-act="editar-mov" data-id="${x.id}">${icono}<span class="rt"><span class="t1">${esc(titulo)}</span><span class="t2">${esc(sub)}</span></span>${amt}</button></div>`;
  }
  const ordenMov = (a, b) => (b.fecha.localeCompare(a.fecha) || b.creado.localeCompare(a.creado));

  // ================= Vista: Resumen =================
  function vInicio() {
    const ym = ymHoy(), d = disponible(ym), sal = saldos(), pat = patrimonio(sal);
    const hoy = new Date(), diasRest = diasDelMes(ym) - hoy.getDate() + 1;
    const fechaLarga = cap(hoy.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }));
    const acciones = `<button class="icon-btn" type="button" data-act="ajustes" aria-label="Ajustes y copia">${IC.ajustes}<span class="dot" data-dot hidden></span></button>${btnMas('nuevo-mov', 'Nuevo movimiento')}`;
    let html = encabezado('Resumen', fechaLarga, acciones);
    const rc = recordatorioCopia();
    if (rc) html += `<section class="card aviso"><span class="ic" style="--c:var(--c-orange)">${IC.caja}</span><div class="rt" style="flex:1 1 180px"><span class="t1" style="white-space:normal; font-weight:600">${rc.nunca ? 'Todavía no guardas una copia' : `Hace ${rc.dias} ${rc.dias === 1 ? 'día' : 'días'} que no guardas una copia`}</span><span class="t2" style="white-space:normal">Guárdala en iCloud Drive o donde prefieras, por si cambias o pierdes el teléfono.</span></div><div class="aviso-btns"><button class="btn small" type="button" data-act="guardar-copia">Guardar copia</button><button class="link sm" type="button" data-act="posponer-copia">Mañana</button></div></section>`;

    const pasos = [
      { ok: S.cuentas.length > 0, t: 'Agrega tus cuentas', s: 'Cheques, ahorro, efectivo y tarjetas', act: 'nueva-cuenta' },
      { ok: S.config.ingresoMensual > 0 || S.movimientos.some((m) => m.tipo === 'ingreso'), t: 'Registra tus ingresos', s: 'Tu sueldo o lo que te paga tu negocio', act: 'nuevo-mov', tipo: 'ingreso' },
      { ok: S.movimientos.length > 0, t: 'Registra tu primer movimiento', s: 'Un gasto o un ingreso', act: 'nuevo-mov' }
    ];
    if (pasos.some((p) => !p.ok)) {
      html += `<section class="section"><div class="sh"><h2>Empieza aquí</h2></div><div class="group steps">${pasos.map((p, i) => `<button class="row ${p.ok ? 'step-ok' : ''}" type="button" data-act="${p.act}" ${p.tipo ? `data-tipo="${p.tipo}"` : ''}><span class="ic" style="--c:var(--tint)">${p.ok ? IC.check : i + 1}</span><span class="rt"><span class="t1">${p.t}</span><span class="t2">${p.s}</span></span><span class="amt muted">${p.ok ? 'Listo' : ''}</span></button>`).join('')}</div></section>`;
    }

    if (d.ingresoBase <= 0) {
      html += `<section class="hero"><p class="k">Puedes gastar este mes</p><p class="hint">Registra tus ingresos (sueldo, negocio) y lo calculo solo: cuánto puedes gastar, cuánto separar para ahorro y cuánto te toca de préstamos.</p><div style="display:flex; gap:10px; flex-wrap:wrap"><button class="btn" type="button" data-act="nuevo-mov" data-tipo="ingreso">Registrar un ingreso</button><button class="btn tinted" type="button" data-act="config-pres">Prefiero escribirlo</button></div></section>`;
    } else {
      const ratio = d.sobre > 0 ? Math.min(1, d.usado / d.sobre) : 1;
      const color = d.libre < 0 ? 'red' : ratio > 0.85 ? 'orange' : 'green';
      const sub = d.libre > 0.005 ? `Unos ${money(d.libre / diasRest)} por día · quedan ${diasRest} ${diasRest === 1 ? 'día' : 'días'} del mes` : d.libre < -0.005 ? 'Ya gastaste más de lo que planeaste este mes' : 'Ya usaste todo lo disponible de este mes';
      html += `<section class="hero"><p class="k">Puedes gastar este mes</p><p class="big ${d.libre < -0.005 ? 'neg' : ''}">${money(d.libre)}</p><p class="sub">${sub}</p><div class="bar lg" style="--c:var(--c-${color})"><i style="width:${(ratio * 100).toFixed(1)}%"></i></div>
        <dl class="kv"><div><dt>${etiquetaIngreso(d.st.ing >= d.ip.v && d.ip.fuente !== 'manual' ? { fuente: 'real' } : d.ip)}</dt><dd>${money(d.ingresoBase)}</dd></div><div><dt>Separado para ahorro</dt><dd>${menos(d.ah)}</dd></div><div><dt>Ya gastaste</dt><dd>${menos(d.st.gas)}</dd></div>${d.pend > 0.005 ? `<div><dt>Préstamos por pagar</dt><dd>${menos(d.pend)}</dd></div>` : ''}</dl></section>`;
    }

    const ahorroMes = d.st.ing - d.st.gas;
    html += `<section class="section"><div class="sh"><h2>Este mes</h2><button class="link sm" type="button" data-act="tab" data-v="movimientos">Ver todo</button></div><div class="stats">
      <div class="stat"><p class="k">Ingresos</p><p class="v pos">${money(d.st.ing)}</p></div>
      <div class="stat"><p class="k">Gastos</p><p class="v">${money(d.st.gas)}</p></div>
      <div class="stat"><p class="k">Te quedó</p><p class="v ${ahorroMes < -0.005 ? 'neg' : ''}">${money(ahorroMes)}</p><p class="s">${d.st.ing > 0 ? pct(ahorroMes / d.st.ing * 100) + ' de tus ingresos' : '—'}</p></div>
    </div></section>`;

    html += `<section class="section"><div class="sh"><h2>Lo que tienes</h2><button class="link sm" type="button" data-act="tab" data-v="cuentas">Cuentas</button></div><div class="card"><p class="muted" style="font-size:15px">Patrimonio neto</p><p class="big ${pat.neto < -0.005 ? 'neg' : ''}" style="font:700 34px/1.15 var(--font-r)">${money(pat.neto)}</p>
      <dl class="kv"><div><dt>Bancos y efectivo</dt><dd>${money(pat.efectivo)}</dd></div>${pat.inv ? `<div><dt>Inversiones</dt><dd>${money(pat.inv)}</dd></div>` : ''}<div><dt>Tarjetas de crédito</dt><dd class="${pat.tarj < -0.005 ? 'neg' : ''}">${money(pat.tarj)}</dd></div><div><dt>Préstamos</dt><dd class="${pat.prest > 0.005 ? 'neg' : ''}">${pat.prest > 0.005 ? '−' : ''}${moneyAbs(pat.prest)}</dd></div></dl></div></section>`;

    const gastosCat = Object.entries(d.st.porCat).map(([k, v]) => ({ c: cat(k), k, v })).filter((x) => (x.c ? x.c.tipo === 'gasto' : x.k === '_g') && x.v > 0).sort((a, b) => b.v - a.v);
    const top = gastosCat.slice(0, 5).map((x) => ({ v: x.v, color: x.c ? x.c.color : 'gray', n: x.c ? x.c.nombre : 'Sin categoría' }));
    const resto = suma(gastosCat.slice(5).map((x) => x.v));
    if (resto > 0) top.push({ v: resto, color: 'gray', n: 'Otras' });
    const meses = []; for (let i = 5; i >= 0; i--) { const m = addMes(ym, -i); const s = statsMes(m); meses.push({ ym: m, ing: s.ing, gas: s.gas }); }
    html += `<div class="grid2">
      <section class="card"><h3 style="margin-bottom:12px">Gastos por categoría</h3>${d.st.gas > 0 ? `<div class="chart-row">${donut(top, d.st.gas)}<div class="legend">${top.map((t) => `<div style="--c:var(--c-${t.color})"><b></b><span>${esc(t.n)}</span><strong>${money(t.v)}</strong></div>`).join('')}</div></div>` : '<p class="muted">Cuando registres gastos de este mes, aquí verás en qué se va tu dinero.</p>'}</section>
      <section class="card"><h3 style="margin-bottom:8px">Últimos 6 meses</h3>${barras(meses)}<div class="chart-key"><span style="--c:var(--c-green)"><b></b>Ingresos</span><span style="--c:var(--c-red)"><b></b>Gastos</span></div></section>
    </div>`;

    const rec = S.movimientos.slice().sort(ordenMov).slice(0, 6);
    html += `<section class="section"><div class="sh"><h2>Recientes</h2>${rec.length ? '<button class="link sm" type="button" data-act="tab" data-v="movimientos">Ver todos</button>' : ''}</div>${rec.length ? `<div class="group">${rec.map(filaMov).join('')}</div>` : '<div class="empty">Tus últimos movimientos aparecerán aquí.</div>'}</section>`;
    return html;
  }

  // ================= Vista: Movimientos =================
  let mesMov = ymHoy();
  const filtro = { cuenta: '', cat: '', q: '', estado: '' };
  function vMovimientos() {
    const opsC = S.cuentas.map((c) => `<option value="${c.id}" ${filtro.cuenta === c.id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');
    const opsK = S.categorias.map((c) => `<option value="${c.id}" ${filtro.cat === c.id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');
    return encabezado('Movimientos', '', btnMas('nuevo-mov', 'Nuevo movimiento')) + mnav('mes-mov', mesMov) +
      `<div class="filters"><select id="f-cuenta" aria-label="Filtrar por cuenta"><option value="">Todas las cuentas</option>${opsC}</select><select id="f-cat" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option>${opsK}</select><select id="f-estado" aria-label="Filtrar por estado en el banco"><option value="">Posteados y pendientes</option><option value="pend" ${filtro.estado === 'pend' ? 'selected' : ''}>Solo pendientes</option><option value="post" ${filtro.estado === 'post' ? 'selected' : ''}>Solo posteados</option></select><input id="f-q" type="search" placeholder="Buscar por nota o categoría" value="${esc(filtro.q)}" autocomplete="off"></div><div id="mov-lista" style="display:grid; gap:14px"></div>`;
  }
  function renderMovLista() {
    const q = filtro.q.trim().toLowerCase();
    const lista = S.movimientos.filter((x) => x.fecha.slice(0, 7) === mesMov && (!filtro.cuenta || x.cuentaId === filtro.cuenta || x.cuentaDestinoId === filtro.cuenta) && (!filtro.cat || x.categoriaId === filtro.cat) && (!filtro.estado || (filtro.estado === 'post') === !!x.posteado) && (!q || (x.nota + ' ' + ((cat(x.categoriaId) || {}).nombre || '')).toLowerCase().includes(q))).sort(ordenMov);
    const el = $('#mov-lista'); if (!el) return;
    if (!lista.length) {
      const hay = filtro.cuenta || filtro.cat || filtro.estado || q;
      el.innerHTML = `<div class="empty"><strong>${hay ? 'Nada con estos filtros' : 'Sin movimientos en ' + esc(nombreMes(mesMov).toLowerCase())}</strong>${hay ? '<button class="btn small tinted" type="button" data-act="limpiar-filtros">Quitar filtros</button>' : 'Registra gastos, ingresos y pagos de tarjeta con el botón +.'}</div>`;
      return;
    }
    const ing = suma(lista.filter((x) => x.tipo === 'ingreso').map((x) => x.monto));
    const gas = suma(lista.filter((x) => x.tipo === 'gasto').map((x) => x.monto));
    let run = null, extra = '';
    if (filtro.cuenta && cuenta(filtro.cuenta)) {
      const c = cuenta(filtro.cuenta), id = c.id, esT = c.tipo === 'tarjeta';
      const todos = S.movimientos.filter((x) => x.cuentaId === id || x.cuentaDestinoId === id).sort((a, b) => a.fecha.localeCompare(b.fecha) || a.creado.localeCompare(b.creado));
      let sAll = c.saldoInicial, sPost = c.saldoInicial; run = {};
      todos.forEach((x) => { const e = efecto(x, id); sAll += e; if (x.posteado) sPost += e; run[x.id] = sAll; });
      const pend = todos.filter((x) => !x.posteado).length;
      const f = (v) => (esT ? (v <= 0.005 ? 'Debes ' + moneyAbs(v) : money(v) + ' a favor') : money(v));
      extra = `<div class="card" style="display:grid; gap:6px; padding:14px 16px"><div class="kv" style="margin:0; padding:0; border:0"><div><dt>${esT ? 'Saldo con todo' : 'Saldo con todo registrado'}</dt><dd>${f(sAll)}</dd></div><div><dt>Lo que dice el banco</dt><dd>${f(sPost)}</dd></div><div><dt>Pendientes por postear</dt><dd>${pend}${pend ? ' · ' + moneyAbs(sAll - sPost) : ''}</dd></div></div></div>`;
    }
    let html = extra + `<div class="totline"><span>Ingresos <b class="pos">${money(ing)}</b></span><span>Gastos <b>${money(gas)}</b></span><span>${lista.length} ${lista.length === 1 ? 'movimiento' : 'movimientos'}</span></div><div>`;
    let dia = null, buf = [];
    const cerrar = () => { if (dia) html += `<p class="day-h"><span>${esc(fDia(dia))}</span></p><div class="group">${buf.join('')}</div>`; };
    lista.forEach((x) => { if (x.fecha !== dia) { cerrar(); dia = x.fecha; buf = []; } buf.push(filaMov(x, { cuenta: filtro.cuenta || null, run: run ? run[x.id] : null })); });
    cerrar();
    el.innerHTML = html + '</div>';
  }

  // ================= Vista: Presupuesto =================
  let mesPres = ymHoy();
  function vPresupuesto() {
    const ym = mesPres, st = statsMes(ym), pa = planAhorro(), cuotas = cuotasMes(ym), ip = ingresoPlan(ym), ing = ip.v;
    const gastos = S.categorias.filter((c) => c.tipo === 'gasto');
    const presDe = (c) => (c.id === CAT_PREST ? cuotas : c.presupuesto);
    const porGrupo = (g) => suma(gastos.filter((c) => c.grupo === g).map(presDe));
    const nec = porGrupo('necesidades'), gus = porGrupo('gustos'), deu = porGrupo('deuda');
    const asignado = nec + gus + deu + pa.plan, libre = ing - asignado;
    let html = encabezado('Presupuesto', '', `<button class="btn small tinted" type="button" data-act="config-pres">Ingreso y ahorro</button>`) + mnav('mes-pres', ym);

    if (ym === ymHoy()) {
      const d = disponible(ym);
      if (d.ingresoBase > 0) html += `<section class="hero" style="padding:16px 20px"><p class="k">Puedes gastar este mes</p><p class="big ${d.libre < -0.005 ? 'neg' : ''}" style="font-size:38px">${money(d.libre)}</p></section>`;
    }

    if (ing <= 0) {
      html += `<section class="hero"><p class="k">Tu plan del mes</p><p class="hint">Registra tus ingresos de este mes y el plan se arma solo, repartiendo tu dinero entre necesidades, gustos, deudas y ahorro. También puedes escribir tu ingreso fijo.</p><div style="display:flex; gap:10px; flex-wrap:wrap"><button class="btn" type="button" data-act="nuevo-mov" data-tipo="ingreso">Registrar un ingreso</button><button class="btn tinted" type="button" data-act="config-pres">Escribirlo</button></div></section>`;
    } else {
      const base = Math.max(ing, asignado) || 1;
      const segs = [['Necesidades', nec, 'blue'], ['Gustos', gus, 'purple'], ['Deudas', deu, 'orange'], ['Ahorro', pa.plan, 'green']];
      const guia = [
        ['Necesidades y deudas', nec + deu, 0.5, 'hasta'],
        ['Gustos', gus, 0.3, 'hasta'],
        ['Ahorro', pa.plan, 0.2, 'al menos']
      ];
      html += `<section class="card"><div class="sh" style="margin-bottom:4px"><h3>Tu plan del mes</h3><span class="muted" style="font-size:15px">Ingreso ${money(ing)}${ip.fuente === 'manual' ? '' : ' · automático'}</span></div>
        <div class="stack" style="margin-top:10px">${segs.filter((s) => s[1] > 0).map((s) => `<i style="--c:var(--c-${s[2]});width:${(s[1] / base * 100).toFixed(2)}%"></i>`).join('')}</div>
        <div class="legend">${segs.map((s) => `<div style="--c:var(--c-${s[2]})"><b></b><span>${s[0]}</span><em>${pct(s[1] / ing * 100)}</em><strong>${money(s[1])}</strong></div>`).join('')}
          <div style="--c:var(--${libre < -0.005 ? 'neg' : 'fill-2'})"><b></b><span>${libre < -0.005 ? 'Te pasas de tu ingreso' : 'Sin asignar'}</span><em>${pct(Math.abs(libre) / ing * 100)}</em><strong class="${libre < -0.005 ? 'neg' : ''}">${money(libre)}</strong></div></div>
        <div class="guide"><p class="muted" style="font-size:13px">Guía 50/30/20 para tu ingreso</p>${guia.map(([n, v, f, modo]) => { const lim = ing * f, ok = modo === 'hasta' ? v <= lim + 0.005 : v >= lim - 0.005; return `<div><span>${n}: ${modo} ${money(lim)}</span><span class="${ok ? 'ok' : 'bad'}">${ok ? 'Vas bien' : modo === 'hasta' ? 'Te pasas ' + money(v - lim) : 'Faltan ' + money(lim - v)}</span></div>`; }).join('')}</div></section>`;
    }

    ['necesidades', 'gustos', 'deuda'].forEach((g) => {
      const cs = gastos.filter((c) => c.grupo === g);
      if (!cs.length) return;
      html += `<section class="section"><div class="sh"><h2>${GRUPOS[g]}</h2><span class="muted" style="font-size:15px">${(() => { const gs = suma(cs.map((c) => st.porCat[c.id] || 0)), ps = suma(cs.map(presDe)); return ps > 0.005 ? `${money(gs)} de ${money(ps)}` : `${money(gs)} gastado`; })()}</span></div><div class="group">${cs.map((c) => filaCat(c, st.porCat[c.id] || 0, presDe(c), cuotas)).join('')}${g === 'gustos' ? `<button class="row add-row" type="button" data-act="nueva-cat"><span class="ic">${IC.plus}</span><span class="rt"><span class="t1">Nueva categoría</span></span></button>` : ''}</div></section>`;
    });
    if (st.porCat._g) html += `<p class="warn-box">Tienes ${money(st.porCat._g)} en gastos sin categoría este mes.</p>`;

    const metas = S.metas;
    html += `<section class="section"><div class="sh"><h2>Metas de ahorro</h2><button class="link sm" type="button" data-act="nueva-meta">Nueva meta</button></div>${metas.length ? `<div class="metas">${metas.map(tarjetaMeta).join('')}</div><p class="note">${pa.manual ? `Separas ${money(pa.plan)} al mes para ahorro. Tus metas piden ${money(pa.metas)} al mes.` : `Tu ahorro mensual se calcula con lo que piden tus metas: ${money(pa.metas)}.`}</p>` : `<div class="empty"><strong>¿Para qué estás ahorrando?</strong>Un fondo de emergencia, un enganche, unas vacaciones. Pon la cantidad y la fecha, y te digo cuánto ahorrar al mes.<button class="btn small" type="button" data-act="nueva-meta">Crear meta</button></div>`}</section>`;

    const ingCats = S.categorias.filter((c) => c.tipo === 'ingreso');
    html += `<section class="section"><div class="sh"><h2>Ingresos</h2><span class="muted" style="font-size:15px">${money(st.ing)} recibido</span></div><div class="group">${ingCats.map((c) => `<button class="row" type="button" data-act="editar-cat" data-id="${c.id}">${icCat(c)}<span class="rt"><span class="t1">${esc(c.nombre)}</span></span><span class="amt pos">${money(st.porCat[c.id] || 0)}</span></button>`).join('')}<button class="row add-row" type="button" data-act="nueva-cat" data-tipo="ingreso"><span class="ic">${IC.plus}</span><span class="rt"><span class="t1">Nueva categoría de ingreso</span></span></button></div></section>`;
    return html;
  }
  function filaCat(c, gastado, pres, cuotas) {
    const over = pres > 0.005 && gastado > pres + 0.005;
    const ratio = pres > 0 ? Math.min(1, gastado / pres) : 0;
    const color = over ? 'red' : ratio > 0.85 ? 'orange' : c.color;
    let sub, der;
    if (c.id === CAT_PREST) sub = cuotas > 0 ? `${money(gastado)} de ${money(cuotas)} · cuotas del mes` : 'Se llena solo con tus préstamos';
    else sub = pres > 0 ? `${money(gastado)} de ${money(pres)}` : (gastado > 0 ? `${money(gastado)} gastado` : 'Toca para poner un límite');
    if (pres > 0.005) der = over ? `<span class="amt neg">${moneyAbs(gastado - pres)}<small>te pasaste</small></span>` : `<span class="amt">${moneyAbs(pres - gastado)}<small>disponible</small></span>`;
    else der = `<span class="amt muted">${gastado > 0 ? money(gastado) : ''}<small>${gastado > 0 ? 'sin límite' : ''}</small></span>`;
    return `<button class="row" type="button" data-act="editar-cat" data-id="${c.id}">${icCat(c)}<span class="rt" style="gap:5px"><span class="t1">${esc(c.nombre)}</span><span class="t2" style="white-space:normal">${sub}</span>${pres > 0.005 ? `<span class="bar" style="--c:var(--c-${color})"><i style="width:${(ratio * 100).toFixed(1)}%"></i></span>` : ''}</span>${der}</button>`;
  }
  function tarjetaMeta(m) {
    const p = m.objetivo > 0 ? m.ahorrado / m.objetivo : 0, mens = mensualMeta(m);
    const txt = mens === 0 ? '¡Meta cumplida!' : mens === null ? 'Sin fecha límite' : `Ahorra ${money(mens)} al mes hasta ${fMes(parseISO(m.fecha))}`;
    return `<button class="meta" type="button" data-act="editar-meta" data-id="${m.id}">${anillo(p, m.color)}<span class="rt"><span class="t1">${esc(m.nombre)}</span><span class="t2">${money(m.ahorrado)} de ${money(m.objetivo)}</span><span class="t2" style="color:var(--c-${mens === 0 ? 'green' : m.color})">${txt}</span></span></button>`;
  }

  // ================= Vista: Cuentas =================
  function vCuentas() {
    const sal = saldos(), pat = patrimonio(sal);
    let html = encabezado('Cuentas', '', `${S.cuentas.length > 1 ? `<button class="btn small tinted" type="button" data-act="transferir">${IC.flechas.replace('<svg', '<svg style="width:18px;height:18px"')}Transferir</button>` : ''}${btnMas('nueva-cuenta', 'Nueva cuenta')}`);
    if (!S.cuentas.length) return html + `<div class="empty"><strong>Agrega tus cuentas</strong>Tu cuenta de cheques, de ahorro, el efectivo y tus tarjetas de crédito. Así sabes cuánto tienes y cuánto debes.<button class="btn small" type="button" data-act="nueva-cuenta">Agregar cuenta</button></div>`;
    const deudas = -pat.tarj + pat.prest;
    html += `<div class="stats"><div class="stat"><p class="k">Patrimonio neto</p><p class="v ${pat.neto < -0.005 ? 'neg' : ''}">${money(pat.neto)}</p></div><div class="stat"><p class="k">Tienes</p><p class="v">${money(pat.efectivo + pat.inv)}</p></div><div class="stat"><p class="k">Debes</p><p class="v ${deudas > 0.005 ? 'neg' : ''}">${money(deudas)}</p><p class="s">Tarjetas y préstamos</p></div></div>`;
    const grupos = [['Bancos y efectivo', ['cheques', 'ahorro', 'efectivo']], ['Inversiones', ['inversion']], ['Tarjetas de crédito', ['tarjeta']]];
    grupos.forEach(([titulo, tipos]) => {
      const cs = S.cuentas.filter((c) => tipos.includes(c.tipo));
      if (!cs.length) return;
      const tot = suma(cs.map((c) => sal[c.id]));
      html += `<section class="section"><div class="sh"><h2>${titulo}</h2><span class="muted" style="font-size:15px">${tipos[0] === 'tarjeta' ? 'Debes ' + moneyAbs(Math.min(0, tot)) : money(tot)}</span></div><div class="group">${cs.map((c) => filaCuenta(c, sal[c.id])).join('')}</div></section>`;
    });
    html += `<p class="note">Para pagar una tarjeta, toca la tarjeta y luego <b>Pagar esta tarjeta</b>, o usa <b>Transferir</b>. El pago baja tu cuenta de cheques y tu deuda al mismo tiempo, sin contarse como gasto otra vez.</p>`;
    return html;
  }
  function filaCuenta(c, v) {
    const t = TIPOS_CUENTA[c.tipo];
    const pend = S.movimientos.filter((x) => !x.posteado && (x.cuentaId === c.id || x.cuentaDestinoId === c.id)).length;
    const pendTxt = pend ? ` · ${pend} ${pend === 1 ? 'pendiente' : 'pendientes'}` : '';
    if (c.tipo === 'tarjeta') {
      const deuda = Math.max(0, -v), uso = c.limite > 0 ? deuda / c.limite : 0;
      const col = uso > 0.7 ? 'red' : uso > 0.3 ? 'orange' : 'green';
      return `<button class="row" type="button" data-act="editar-cuenta" data-id="${c.id}">${icCuenta(c)}<span class="rt" style="gap:5px"><span class="t1">${esc(c.nombre)}</span><span class="t2">${c.limite > 0 ? `Usas ${Math.round(uso * 100)}% de ${money(c.limite)}` : 'Tarjeta de crédito'}${pendTxt}</span>${c.limite > 0 ? `<span class="bar" style="--c:var(--c-${col})"><i style="width:${Math.min(100, uso * 100).toFixed(1)}%"></i></span>` : ''}</span><span class="amt ${deuda > 0.005 ? 'neg' : ''}">${v > 0.005 ? money(v) : moneyAbs(deuda)}<small>${v > 0.005 ? 'a favor' : 'por pagar'}</small></span></button>`;
    }
    return `<button class="row" type="button" data-act="editar-cuenta" data-id="${c.id}">${icCuenta(c)}<span class="rt"><span class="t1">${esc(c.nombre)}</span><span class="t2">${t.n}${pendTxt}</span></span><span class="amt ${v < -0.005 ? 'neg' : ''}">${money(v)}</span></button>`;
  }

  // ================= Vista: Préstamos =================
  let prestAbierto = null;
  function vPrestamos() {
    if (prestAbierto && S.prestamos.some((p) => p.id === prestAbierto)) return vPrestDetalle();
    prestAbierto = null;
    let html = encabezado('Préstamos', '', btnMas('nuevo-prest', 'Nuevo préstamo'));
    if (!S.prestamos.length) return html + `<div class="empty"><strong>Aún no tienes préstamos</strong>Registra tu hipoteca, tu auto o cualquier crédito, y simula abonos extra para pagarlo antes.<button class="btn small" type="button" data-act="nuevo-prest">Agregar préstamo</button></div>`;
    const calc = S.prestamos.map((p) => ({ p, a: amortizar(p) }));
    html += `<div class="stats"><div class="stat"><p class="k">Debes hoy</p><p class="v">${money(suma(calc.map((x) => x.a.saldoHoy)))}</p></div><div class="stat"><p class="k">Pagos al mes</p><p class="v">${money(suma(calc.filter((x) => x.a.saldoHoy > 0).map((x) => x.a.cuota)))}</p></div><div class="stat"><p class="k">Abonos extra</p><p class="v">${money(suma(calc.map((x) => x.a.totEx)))}</p></div><div class="stat"><p class="k">Intereses ahorrados</p><p class="v pos">${money(suma(calc.map((x) => x.a.ahorro)))}</p></div></div>`;
    html += `<div class="loans">${calc.map(({ p, a }) => { const av = p.monto > 0 ? (p.monto - a.saldoHoy) / p.monto * 100 : 0; return `<article class="loan"><span class="chip">${TIPOS_PREST[p.tipo]}</span><h3>${esc(p.nombre)}</h3><div><p class="muted" style="font-size:13px">Saldo hoy</p><p class="big">${money(a.saldoHoy)}</p></div><div><div class="bar"><i style="width:${Math.min(100, av).toFixed(1)}%"></i></div><p class="muted" style="font-size:13px;margin-top:6px">${pct(av)} pagado · termina en ${a.ultima ? fMes(a.ultima) : '—'}</p></div><dl class="facts"><div><dt>Cuota mensual</dt><dd>${money(a.cuota)}</dd></div><div><dt>Monto original</dt><dd>${money(p.monto)}</dd></div><div><dt>Tasa anual</dt><dd>${p.tasa}%</dd></div><div><dt>Plazo</dt><dd>${tiempo(Math.round(p.plazo * 12))}</dd></div></dl><div class="loan-actions"><button class="btn small tinted" type="button" data-act="abrir-prest" data-id="${p.id}">Ver tabla y abonos</button><button class="link sm" type="button" data-act="editar-prest" data-id="${p.id}">Editar</button></div></article>`; }).join('')}</div>`;
    return html;
  }
  function vPrestDetalle() {
    return `<button class="back" type="button" data-act="prest-volver">${IC.izq}Préstamos</button>
      <header class="vh"><div><p class="eyebrow" id="d-tipo"></p><h1 class="lt" id="d-nombre"></h1><p class="sub" id="d-sub"></p></div><div class="vh-act"><button class="btn small tinted" type="button" data-act="editar-prest" data-id="${prestAbierto}">Editar</button></div></header>
      <div class="stats" id="d-tiles"></div>
      <div class="grid2">
        <section class="card"><h3>Progreso del pago</h3><div class="g-head"><span class="muted">Capital pagado a hoy</span><span class="g-pct" id="g1-pct"></span></div><div class="g-track"><div class="g-fill" id="g1-fill"><span></span></div></div><div class="g-scale"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div><dl class="kv" id="g1-facts"></dl></section>
        <section class="card warn-g"><h3>Saldo restante</h3><div class="g-head"><span class="muted">Capital por pagar</span><span class="g-pct" id="g2-pct"></span></div><div class="g-track"><div class="g-fill" id="g2-fill"><span></span></div></div><div class="g-scale"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div><dl class="kv" id="g2-facts"></dl></section>
      </div>
      <section class="card"><div class="sh" style="flex-wrap:wrap"><h3>Tabla de amortización</h3><span class="tlegend"><i></i>Pagos con fecha anterior a hoy</span></div><p class="muted" style="font-size:15px">Escribe el abono extra en la fila del mes en que lo hiciste. La fecha de ese pago queda en esa fila y todo se recalcula al momento.</p>
        <div class="table-scroll"><table><thead><tr><th>#</th><th>Fecha</th><th>Cuota</th><th>Capital</th><th>Interés</th><th>Abono extra</th><th>Saldo</th></tr></thead><tbody id="tbody"></tbody><tfoot><tr><td colspan="2">Totales</td><td id="t-pago"></td><td id="t-cap"></td><td id="t-int"></td><td id="t-ex"></td><td></td></tr></tfoot></table></div></section>`;
  }
  let filas = [];
  function montarDetalle() {
    const p = S.prestamos.find((x) => x.id === prestAbierto); if (!p) return;
    const a = amortizar(p);
    $('#tbody').innerHTML = a.rows.map((r) => `<tr id="r-${r.m}"><td>${r.m}</td><td>${fFecha(r.fecha)}</td><td class="pago"></td><td class="cap"></td><td class="int"></td><td><input class="abono money" type="text" inputmode="numeric" autocomplete="off" placeholder="0.00" data-m="${r.m}" aria-label="Abono extra del pago ${r.m}"></td><td class="sal"></td></tr>`).join('');
    filas = [null];
    a.rows.forEach((r) => { const tr = document.getElementById('r-' + r.m); filas.push({ tr, pago: tr.querySelector('.pago'), cap: tr.querySelector('.cap'), int: tr.querySelector('.int'), sal: tr.querySelector('.sal'), inp: tr.querySelector('input') }); });
    actualizarDetalle();
  }
  function gauge(fill, pctEl, v) {
    v = Math.max(0, Math.min(100, v));
    const el = $(fill); el.style.width = v + '%'; el.style.setProperty('--w', v + '%'); el.classList.toggle('out', v < 16);
    el.querySelector('span').textContent = pct(v); $(pctEl).textContent = pct(v);
  }
  function actualizarDetalle() {
    const p = S.prestamos.find((x) => x.id === prestAbierto); if (!p || !$('#tbody')) return;
    const a = amortizar(p);
    if (filas.length !== a.rows.length + 1) { montarDetalle(); return; }
    $('#d-tipo').textContent = TIPOS_PREST[p.tipo];
    $('#d-nombre').textContent = p.nombre;
    $('#d-sub').textContent = `${money(p.monto)} al ${p.tasa}% anual (${METODOS[p.metodo]}) · ${tiempo(a.n)} · primer pago ${fFecha(fechaPago(p, 1))}`;
    $('#d-tiles').innerHTML = `<div class="stat"><p class="k">Cuota mensual</p><p class="v">${money(a.cuota)}</p></div><div class="stat"><p class="k">Saldo hoy</p><p class="v">${money(a.saldoHoy)}</p></div><div class="stat"><p class="k">Abonos extra</p><p class="v">${money(a.totEx)}</p></div><div class="stat"><p class="k">Intereses ahorrados</p><p class="v pos">${money(a.ahorro)}</p><p class="s">de ${money(a.intOriginal)} sin abonos</p></div><div class="stat"><p class="k">Tiempo ahorrado</p><p class="v pos">${tiempo(a.mesesAhorrados)}</p></div><div class="stat"><p class="k">Último pago</p><p class="v">${a.ultima ? fFecha(a.ultima) : '—'}</p></div>`;
    const pagado = p.monto - a.saldoHoy, restantes = a.meses - a.pagados;
    gauge('#g1-fill', '#g1-pct', p.monto > 0 ? pagado / p.monto * 100 : 0);
    gauge('#g2-fill', '#g2-pct', p.monto > 0 ? a.saldoHoy / p.monto * 100 : 0);
    $('#g1-facts').innerHTML = `<div><dt>Capital pagado</dt><dd>${money(pagado)} de ${money(p.monto)}</dd></div><div><dt>Pagos hechos</dt><dd>${a.pagados} de ${a.meses}</dd></div><div><dt>Retorno de tus abonos</dt><dd>${a.totEx > 0 ? pct(a.ahorro / a.totEx * 100) : '—'}</dd></div>`;
    $('#g2-facts').innerHTML = `<div><dt>Saldo pendiente</dt><dd>${money(a.saldoHoy)}</dd></div><div><dt>Pagos restantes</dt><dd>${restantes} (${tiempo(restantes)})</dd></div><div><dt>Intereses por pagar</dt><dd>${money(a.intRestante)}</dd></div>`;
    const activo = document.activeElement;
    a.rows.forEach((r) => {
      const f = filas[r.m];
      f.tr.classList.toggle('fin', !!r.fin);
      f.tr.classList.toggle('pagado', !r.fin && r.m <= a.idxHoy);
      f.tr.classList.toggle('hoy', !r.fin && r.m === a.idxHoy);
      if (r.fin) { f.pago.textContent = f.cap.textContent = f.int.textContent = '—'; f.sal.textContent = 'Liquidado'; f.inp.disabled = true; if (f.inp !== activo) f.inp.value = ''; }
      else {
        f.pago.textContent = money(r.pago); f.cap.textContent = money(r.cap); f.int.textContent = money(r.int); f.sal.textContent = money(r.saldo); f.inp.disabled = false;
        const g = p.extras[r.m] ? fmtNum(p.extras[r.m]) : '';
        if (f.inp !== activo && f.inp.value !== g) f.inp.value = g;
      }
      f.inp.classList.toggle('tiene', !!p.extras[r.m]);
    });
    $('#t-pago').textContent = money(a.totInt + a.totCap); $('#t-cap').textContent = money(a.totCap); $('#t-int').textContent = money(a.totInt); $('#t-ex').textContent = money(a.totEx);
  }

  // ================= Navegación =================
  const VISTAS = { inicio: ['Resumen', vInicio], movimientos: ['Movimientos', vMovimientos], presupuesto: ['Presupuesto', vPresupuesto], cuentas: ['Cuentas', vCuentas], prestamos: ['Préstamos', vPrestamos] };
  let vista = 'inicio';
  function pintarNav() {
    $('#nav-tab').innerHTML = Object.entries(VISTAS).map(([k, [n]]) => `<button class="tab ${vista === k ? 'on' : ''}" type="button" data-act="tab" data-v="${k}" ${vista === k ? 'aria-current="page"' : ''}>${IC[k]}<span>${n}</span>${k === 'inicio' ? '<span class="dot" data-dot hidden></span>' : ''}</button>`).join('');
    $('#nav-side').innerHTML = Object.entries(VISTAS).map(([k, [n]]) => `<button class="nav-i ${vista === k ? 'on' : ''}" type="button" data-act="tab" data-v="${k}" ${vista === k ? 'aria-current="page"' : ''}>${IC[k]}<span>${n}</span></button>`).join('');
    $('#side-ajustes').innerHTML = `${IC.ajustes}<span>Ajustes y copia</span><span class="dot" data-dot hidden></span>`;
  }
  function render() {
    pintarNav();
    $('#view').innerHTML = VISTAS[vista][1]();
    if (vista === 'movimientos') montarMovimientos();
    if (vista === 'prestamos' && prestAbierto) montarDetalle();
    estadoCopia();
  }
  function ir(v) {
    if (!VISTAS[v]) v = 'inicio';
    if (v === 'prestamos' && vista !== 'prestamos') prestAbierto = null;
    vista = v;
    try { if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v); } catch (e) {}
    render(); window.scrollTo(0, 0);
  }
  function montarMovimientos() {
    $('#f-cuenta').addEventListener('change', (e) => { filtro.cuenta = e.target.value; renderMovLista(); });
    $('#f-cat').addEventListener('change', (e) => { filtro.cat = e.target.value; renderMovLista(); });
    $('#f-estado').addEventListener('change', (e) => { filtro.estado = e.target.value; renderMovLista(); });

  }

  // ================= Hojas =================
  let alCerrar = null;
  function abrirSheet(html) { const b = $('#sheet-box'); b.innerHTML = html; $('#sheet').hidden = false; b.scrollTop = 0; setTimeout(() => { const f = b.querySelector('[autofocus]'); if (f && window.matchMedia('(pointer: fine)').matches) f.focus(); }, 60); return b; }
  function cerrarSheet() { $('#sheet').hidden = true; $('#sheet-box').innerHTML = ''; if ($('#lock').hidden) padActivo = null; if (alCerrar) { const f = alCerrar; alCerrar = null; f(); } }
  const cabeza = (titulo, guardar = true) => `<div class="sheet-head"><button class="link" type="button" data-act="cerrar-sheet">${guardar ? 'Cancelar' : 'Cerrar'}</button><h2>${esc(titulo)}</h2>${guardar ? '<button class="link strong" type="submit">Guardar</button>' : '<span></span>'}</div>`;
  const opsColor = (sel) => `<div class="colors">${PALETA.map((c) => `<label style="--c:var(--c-${c})"><input type="radio" name="color" value="${c}" ${sel === c ? 'checked' : ''} aria-label="${c}"></label>`).join('')}</div>`;

  let resolverC = null;
  function confirmar(titulo, texto, ok = 'Eliminar', peligro = true) {
    $('#c-titulo').textContent = titulo; $('#c-texto').textContent = texto; $('#c-si').textContent = ok; $('#c-si').classList.toggle('danger', peligro);
    $('#confirm').hidden = false; setTimeout(() => $('#c-no').focus(), 30);
    return new Promise((res) => { resolverC = res; });
  }
  const cerrarC = (v) => { $('#confirm').hidden = true; if (resolverC) resolverC(v); resolverC = null; };
  $('#c-si').addEventListener('click', () => cerrarC(true));
  $('#c-no').addEventListener('click', () => cerrarC(false));

  // ----- Movimiento -----
  function sheetMov(id, tipoIni, preset = {}) {
    if (!S.cuentas.length) {
      abrirSheet(`${cabeza('Nuevo movimiento', false)}<div class="empty" style="background:var(--sheet-card)"><strong>Primero agrega una cuenta</strong>Por ejemplo tu cuenta de cheques, el efectivo o tu tarjeta de crédito.<button class="btn small" type="button" data-act="nueva-cuenta">Agregar cuenta</button></div>`);
      return;
    }
    const x = id ? S.movimientos.find((m) => m.id === id) : null;
    let tipo = x ? x.tipo : (['gasto', 'ingreso', 'transferencia'].includes(tipoIni) ? tipoIni : 'gasto');
    const opsCuenta = (sel) => S.cuentas.map((c) => `<option value="${c.id}" ${sel === c.id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');
    const noTarj = S.cuentas.find((c) => c.tipo === 'cheques') || S.cuentas.find((c) => c.tipo !== 'tarjeta') || S.cuentas[0];
    let cuentaIni = x ? x.cuentaId : (preset.desde && cuenta(preset.desde) ? preset.desde : (filtro.cuenta && cuenta(filtro.cuenta) ? filtro.cuenta : noTarj.id));
    if (!x && preset.hacia && cuentaIni === preset.hacia) cuentaIni = (S.cuentas.find((c) => c.id !== preset.hacia && c.tipo !== 'tarjeta') || S.cuentas.find((c) => c.id !== preset.hacia) || noTarj).id;
    const destIni = x && x.cuentaDestinoId ? x.cuentaDestinoId : (preset.hacia && cuenta(preset.hacia) ? preset.hacia : (S.cuentas.find((c) => c.id !== cuentaIni && c.tipo === 'tarjeta') || S.cuentas.find((c) => c.id !== cuentaIni) || S.cuentas[0]).id);
    const notaIni = x ? x.nota : (preset.hacia && cuenta(preset.hacia) && cuenta(preset.hacia).tipo === 'tarjeta' ? 'Pago de ' + cuenta(preset.hacia).nombre : '');
    const b = abrirSheet(`<form id="form-mov" novalidate>${cabeza(x ? 'Editar movimiento' : 'Nuevo movimiento')}
      <div style="display:grid; gap:18px">
      <div class="seg" role="group" aria-label="Tipo de movimiento"><button type="button" data-tipo="gasto">Gasto</button><button type="button" data-tipo="ingreso">Ingreso</button><button type="button" data-tipo="transferencia">Transferencia</button></div>
      <div class="monto"><span>$</span><input id="m-monto" class="money" type="text" inputmode="numeric" autocomplete="off" placeholder="0.00" aria-label="Cantidad" value="${x ? fmtNum(x.monto) : ''}" autofocus></div>
      <div class="group">
        <div class="frow"><label for="m-cuenta" id="l-cuenta">Cuenta</label><select id="m-cuenta">${opsCuenta(cuentaIni)}</select></div>
        <div class="frow" id="row-dest"><label for="m-dest">Hacia</label><select id="m-dest">${opsCuenta(destIni)}</select></div>
        <div class="frow" id="row-cat"><label for="m-cat">Categoría</label><select id="m-cat"></select></div>
        <div class="frow"><label for="m-fecha">Fecha</label><input id="m-fecha" type="date" value="${x ? x.fecha : hoyISO()}"></div>
        <div class="frow"><label for="m-nota">Nota</label><input id="m-nota" type="text" placeholder="Opcional" value="${esc(notaIni)}" autocomplete="off"></div>
        <div class="frow"><label for="m-post" style="width:auto; flex:1">Ya aparece en el banco</label><input id="m-post" class="switch" type="checkbox" ${x && x.posteado ? 'checked' : ''}></div>
      </div>
      <p class="note" id="m-hint" style="margin-top:-8px"></p>
      <p class="form-error" id="m-error" role="alert"></p>
      ${x ? '<button class="btn block destructive" type="button" id="m-borrar">Eliminar movimiento</button>' : ''}
      </div></form>`);
    const pintar = () => {
      b.querySelectorAll('.seg button').forEach((bt) => bt.classList.toggle('on', bt.dataset.tipo === tipo));
      $('#row-dest', b).hidden = tipo !== 'transferencia';
      $('#row-cat', b).hidden = tipo === 'transferencia';
      $('#l-cuenta', b).textContent = tipo === 'transferencia' ? 'Desde' : tipo === 'ingreso' ? 'A la cuenta' : 'Pagado con';
      const tc = tipo === 'ingreso' ? 'ingreso' : 'gasto';
      const sel = x && x.tipo === tipo ? x.categoriaId : $('#m-cat', b).value;
      const lista = S.categorias.filter((c) => c.tipo === tc);
      $('#m-cat', b).innerHTML = '<option value="">Sin categoría</option>' + lista.map((c) => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
      $('#m-cat', b).value = lista.some((c) => c.id === sel) ? sel : (lista[0] ? lista[0].id : '');
      $('#m-hint', b).textContent = tipo !== 'transferencia' ? '' : S.cuentas.length < 2 ? 'Para transferir necesitas al menos dos cuentas. Agrega otra en Cuentas.' : 'El dinero sale de una cuenta y entra a la otra, así que no cuenta como gasto ni como ingreso. Úsalo para pagar tu tarjeta o mover dinero a tu ahorro.';
    };
    pintar();
    b.querySelectorAll('.seg button').forEach((bt) => bt.addEventListener('click', () => { tipo = bt.dataset.tipo; pintar(); }));
    $('#form-mov', b).addEventListener('submit', (e) => {
      e.preventDefault();
      const monto = parseMonto($('#m-monto', b).value), cId = $('#m-cuenta', b).value, dId = $('#m-dest', b).value, fecha = $('#m-fecha', b).value;

      else if (!fecha) err = 'Elige la fecha.';

      if (x) S.movimientos[S.movimientos.indexOf(x)] = nuevo; else S.movimientos.push(nuevo);
      guardar(); cerrarSheet(); toast(x ? 'Movimiento actualizado' : 'Movimiento guardado');
      if (vista === 'movimientos' && fecha.slice(0, 7) !== mesMov && !x) mesMov = fecha.slice(0, 7);
      render();

      if (!(await confirmar('¿Eliminar movimiento?', 'Se quita de tus cuentas y de tu presupuesto.'))) return;
      S.movimientos = S.movimientos.filter((m) => m.id !== x.id); guardar(); cerrarSheet(); toast('Movimiento eliminado'); render();
    });

  // ----- Cuenta -----
  function sheetCuenta(id) {
    const c = id ? cuenta(id) : null, sal = saldos();
    const actual = c ? sal[c.id] : 0;
    const efecto = c ? actual - c.saldoInicial : 0;
    const b = abrirSheet(`<form id="form-cta" novalidate>${cabeza(c ? 'Editar cuenta' : 'Nueva cuenta')}<div style="display:grid; gap:18px">
      <div class="group">
        <div class="frow"><label for="a-nombre">Nombre</label><input id="a-nombre" type="text" placeholder="Ej. Chase cheques" value="${c ? esc(c.nombre) : ''}" autocomplete="off" autofocus></div>
        <div class="frow"><label for="a-tipo">Tipo</label><select id="a-tipo">${Object.entries(TIPOS_CUENTA).map(([k, t]) => `<option value="${k}" ${(c ? c.tipo : 'cheques') === k ? 'selected' : ''}>${t.n}</option>`).join('')}</select></div>
        <div class="frow"><label for="a-saldo" id="l-saldo">Saldo actual</label><input id="a-saldo" class="money signed" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
        <div class="frow" id="row-lim"><label for="a-lim">Límite de crédito</label><input id="a-lim" class="money" type="text" inputmode="numeric" placeholder="0.00" autocomplete="off" value="${c && c.limite ? fmtNum(c.limite) : ''}"></div>
      </div>
      <p class="note" id="a-hint"></p>
      <p class="form-error" id="a-error" role="alert"></p>
      ${c ? `<div class="sheet-actions">${S.cuentas.length > 1 ? (c.tipo === 'tarjeta' ? `<button class="btn block" type="button" data-act="transferir" data-hacia="${c.id}">Pagar esta tarjeta</button>` : `<button class="btn block" type="button" data-act="transferir" data-desde="${c.id}">Transferir desde esta cuenta</button>`) : ''}<button class="btn block tinted" type="button" id="a-ver">Ver movimientos de esta cuenta</button><button class="btn block destructive" type="button" id="a-borrar">Eliminar cuenta</button></div>` : ''}
    </div></form>`);
    const pintar = () => {
      const esT = $('#a-tipo', b).value === 'tarjeta';
      $('#row-lim', b).hidden = !esT;
      $('#l-saldo', b).textContent = esT ? 'Deuda actual' : 'Saldo actual';
      $('#a-hint', b).textContent = esT ? 'Escribe lo que debes hoy en la tarjeta. Los gastos con tarjeta suben la deuda y los pagos (transferencias) la bajan.' : 'Escribe lo que tienes hoy en la cuenta. Si después no coincide con tu banco, aquí lo corriges.';
    };
    const valIni = c ? (c.tipo === 'tarjeta' ? -actual : actual) : 0;
    $('#a-saldo', b).value = c ? fmtNum(valIni) : '';
    pintar();
    $('#a-tipo', b).addEventListener('change', pintar);
    $('#form-cta', b).addEventListener('submit', (e) => {
      e.preventDefault();
      const nombre = $('#a-nombre', b).value.trim(), tipo = $('#a-tipo', b).value;
      const raw = $('#a-saldo', b).value.trim(), v = raw === '' ? 0 : parseMonto(raw);
      if (!nombre) { $('#a-error', b).textContent = 'Escribe un nombre para la cuenta.'; return; }
      if (isNaN(v)) { $('#a-error', b).textContent = 'Revisa el saldo: solo números.'; return; }
      const deseado = tipo === 'tarjeta' ? -v : v;
      const lim = tipo === 'tarjeta' ? Math.max(0, parseMonto($('#a-lim', b).value) || 0) : 0;
      if (c) { Object.assign(c, { nombre, tipo, limite: lim, saldoInicial: deseado - efecto }); }
      else S.cuentas.push({ id: nuevoId('a'), nombre, tipo, saldoInicial: deseado, limite: lim, creado: new Date().toISOString() });
      guardar(); cerrarSheet(); toast(c ? 'Cuenta actualizada' : 'Cuenta agregada'); render();
    });
    if (c) {
      $('#a-ver', b).addEventListener('click', () => { filtro.cuenta = c.id; filtro.cat = ''; filtro.q = ''; cerrarSheet(); ir('movimientos'); });
      $('#a-borrar', b).addEventListener('click', async () => {
        const n = S.movimientos.filter((m) => m.cuentaId === c.id || m.cuentaDestinoId === c.id).length;
        if (!(await confirmar('¿Eliminar cuenta?', n ? `También se borrarán sus ${n} movimientos.` : 'La cuenta no tiene movimientos.'))) return;
        S.cuentas = S.cuentas.filter((x) => x.id !== c.id);
        S.movimientos = S.movimientos.filter((m) => m.cuentaId !== c.id && m.cuentaDestinoId !== c.id);
        if (filtro.cuenta === c.id) filtro.cuenta = '';
        guardar(); cerrarSheet(); toast('Cuenta eliminada'); render();
      });
    }
  }

  // ----- Categoría -----
  function sheetCat(id, tipoNuevo) {
    const c = id ? cat(id) : null;
    const tipo = c ? c.tipo : (tipoNuevo === 'ingreso' ? 'ingreso' : 'gasto');
    const sis = c && c.sistema;
    const b = abrirSheet(`<form id="form-cat" novalidate>${cabeza(c ? (tipo === 'ingreso' ? 'Categoría de ingreso' : 'Categoría') : (tipo === 'ingreso' ? 'Nueva categoría de ingreso' : 'Nueva categoría'))}<div style="display:grid; gap:18px">
      <div class="group">
        <div class="frow"><label for="k-nombre">Nombre</label><input id="k-nombre" type="text" value="${c ? esc(c.nombre) : ''}" placeholder="Ej. Mascotas" autocomplete="off" ${sis ? 'disabled' : 'autofocus'}></div>
        ${tipo === 'gasto' ? `<div class="frow"><label for="k-grupo">Tipo de gasto</label><select id="k-grupo" ${sis ? 'disabled' : ''}>${Object.entries(GRUPOS).map(([k, n]) => `<option value="${k}" ${(c ? c.grupo : 'gustos') === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div class="frow"><label for="k-pres">Límite al mes</label><input id="k-pres" class="money" type="text" inputmode="numeric" placeholder="0.00" autocomplete="off" value="${sis ? fmtNum(cuotasMes(mesPres)) : (c && c.presupuesto ? fmtNum(c.presupuesto) : '')}" ${sis ? 'disabled' : ''}></div>` : ''}
        ${sis ? '' : `<div class="frow col"><span class="lbl">Color</span>${opsColor(c ? c.color : 'blue')}</div>`}
      </div>
      <p class="note">${sis ? 'El límite de esta categoría es la suma de las cuotas de tus préstamos de este mes. Registra aquí tus pagos de préstamos para que el presupuesto los vea.' : tipo === 'gasto' ? 'Necesidades: lo indispensable (renta, comida, luz). Gustos: lo que podrías recortar. Deudas: pagos de créditos.' : ''}</p>
      <p class="form-error" id="k-error" role="alert"></p>
      ${c && !sis ? '<button class="btn block destructive" type="button" id="k-borrar">Eliminar categoría</button>' : ''}
    </div></form>`);
    $('#form-cat', b).addEventListener('submit', (e) => {
      e.preventDefault();
      if (sis) { cerrarSheet(); return; }
      const nombre = $('#k-nombre', b).value.trim();
      if (!nombre) { $('#k-error', b).textContent = 'Escribe un nombre.'; return; }
      const color = (b.querySelector('input[name="color"]:checked') || {}).value || 'blue';
      const grupo = tipo === 'gasto' ? $('#k-grupo', b).value : 'ingreso';
      const pres = tipo === 'gasto' ? Math.max(0, parseMonto($('#k-pres', b).value) || 0) : 0;
      if (c) Object.assign(c, { nombre, grupo, color, presupuesto: pres });
      else S.categorias.push({ id: nuevoId('c'), nombre, tipo, grupo, color, presupuesto: pres, sistema: false });
      guardar(); cerrarSheet(); toast(c ? 'Categoría actualizada' : 'Categoría creada'); render();
    });
    if (c && !sis) $('#k-borrar', b).addEventListener('click', async () => {
      const n = S.movimientos.filter((m) => m.categoriaId === c.id).length;
      if (!(await confirmar('¿Eliminar categoría?', n ? `Sus ${n} movimientos se quedan, pero sin categoría.` : 'No tiene movimientos.'))) return;
      S.categorias = S.categorias.filter((x) => x.id !== c.id);
      S.movimientos.forEach((m) => { if (m.categoriaId === c.id) m.categoriaId = null; });
      if (filtro.cat === c.id) filtro.cat = '';
      guardar(); cerrarSheet(); toast('Categoría eliminada'); render();
    });
  }

  // ----- Meta -----
  function sheetMeta(id) {
    const m = id ? S.metas.find((x) => x.id === id) : null;
    const b = abrirSheet(`<form id="form-meta" novalidate>${cabeza(m ? 'Editar meta' : 'Nueva meta')}<div style="display:grid; gap:18px">
      <div class="group">
        <div class="frow"><label for="g-nombre">Nombre</label><input id="g-nombre" type="text" placeholder="Ej. Fondo de emergencia" value="${m ? esc(m.nombre) : ''}" autocomplete="off" autofocus></div>
        <div class="frow"><label for="g-obj">Quiero juntar</label><input id="g-obj" class="money" type="text" inputmode="numeric" placeholder="0.00" autocomplete="off" value="${m ? fmtNum(m.objetivo) : ''}"></div>
        <div class="frow"><label for="g-aho">Ya tengo</label><input id="g-aho" class="money" type="text" inputmode="numeric" placeholder="0.00" autocomplete="off" value="${m && m.ahorrado ? fmtNum(m.ahorrado) : ''}"></div>

      <p class="note" id="g-calc"></p>
      <p class="form-error" id="g-error" role="alert"></p>
      ${m ? '<button class="btn block destructive" type="button" id="g-borrar">Eliminar meta</button>' : ''}
    </div></form>`);
    const calc = () => {
      const o = parseMonto($('#g-obj', b).value) || 0, a = parseMonto($('#g-aho', b).value) || 0, f = $('#g-fecha', b).value;
      const v = mensualMeta({ objetivo: o, ahorrado: a, fecha: f });
      $('#g-calc', b).textContent = !o ? 'Escribe cuánto quieres juntar.' : v === 0 ? 'Ya tienes lo que necesitas para esta meta.' : v === null ? 'Ponle una fecha y te digo cuánto ahorrar cada mes.' : `Necesitas ahorrar ${money(v)} al mes durante ${tiempo(Math.max(1, mesesHasta(f)))}.`;
    };
    calc();
    ['#g-obj', '#g-aho', '#g-fecha'].forEach((s) => { $(s, b).addEventListener('input', calc); $(s, b).addEventListener('change', calc); });
    $('#form-meta', b).addEventListener('submit', (e) => {
      e.preventDefault();
      const nombre = $('#g-nombre', b).value.trim(), objetivo = parseMonto($('#g-obj', b).value);
      if (!nombre) { $('#g-error', b).textContent = 'Escribe un nombre para la meta.'; return; }
      if (!(objetivo > 0)) { $('#g-error', b).textContent = 'Escribe cuánto quieres juntar.'; return; }
      const datos = { nombre, objetivo, ahorrado: Math.max(0, parseMonto($('#g-aho', b).value) || 0), fecha: $('#g-fecha', b).value || '', color: (b.querySelector('input[name="color"]:checked') || {}).value || 'green' };
      if (m) Object.assign(m, datos); else S.metas.push({ id: nuevoId('g'), ...datos });
      guardar(); cerrarSheet(); toast(m ? 'Meta actualizada' : 'Meta creada'); render();
    });
    if (m) $('#g-borrar', b).addEventListener('click', async () => {
      if (!(await confirmar('¿Eliminar meta?', 'Se quita de tu plan de ahorro.'))) return;
      S.metas = S.metas.filter((x) => x.id !== m.id); guardar(); cerrarSheet(); toast('Meta eliminada'); render();
    });
  }

    if (cambio > copia) return { ok: false, t: 'Tienes cambios sin guardar en tu copia' };
    return { ok: true, t: 'Copia al día · ' + new Date(copia).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) };
  }
  function hayDatos() { return S.cuentas.length || S.movimientos.length || S.prestamos.length || S.metas.length || S.config.ingresoMensual; }

      <div class="sheet-actions"><button class="btn block" type="button" data-act="guardar-copia">Guardar copia</button><button class="btn block tinted" type="button" data-act="abrir-copia">Abrir copia</button></div>
      <p class="note" style="margin-top:0">«Guardar copia» crea el archivo <b>mis-finanzas.json</b>${cifradoOk ? ', cifrado con tu contraseña de copias' : ''}. Guárdalo donde prefieras: iCloud Drive, Google Drive, OneDrive o tu computadora. En otro dispositivo, usa «Abrir copia» para cargar todo.</p>
      <div style="display:grid; gap:8px"><p class="eyebrow" style="padding:0 16px">Copias automáticas</p><div class="group">

        <button class="row plain" type="button" id="z-snaps"><span class="rt"><span class="t1">Copias en este dispositivo</span><span class="t2">Una por cada día que abres la app · últimas ${MAX_SNAPS}</span></span><span class="amt" style="color:var(--tint)">Ver</span></button>
      </div><p class="note">Apple no deja que una página web guarde archivos sola en iCloud, así que la app te avisa en Resumen cuando toca guardar tu copia y lo haces con un toque.</p></div>
      ${cifradoOk ? `<div style="display:grid; gap:8px"><p class="eyebrow" style="padding:0 16px">Seguridad</p><div class="group">
        <div class="frow"><label for="z-lock" class="lbl-w">Bloquear con código</label><input id="z-lock" class="switch" type="checkbox" ${lk ? 'checked' : ''}></div>

  // ================= Copia de seguridad =================
  async function guardarCopia() {
    if (!hayDatos()) { toast('Todavía no hay datos para guardar.'); return; }
    let texto;
    const { claveCopia, ...cfg } = S.config;
    const datosCopia = { ...S, config: cfg };
    if (cifradoOk) {
      if (!claveCopia) { sheetClaveCopia(true); return; }
      try {
        const k = await llaveCopia();
        const c = await cifrar(k.key, datosCopia);
        texto = JSON.stringify({ app: 'mis-finanzas', version: 4, fecha: new Date().toISOString(), cifrado: { alg: 'AES-GCM', kdf: 'PBKDF2-SHA256', iter: ITER_COPIA, salt: b64(k.salt), iv: c.iv }, datos: c.ct });
      } catch (e) { toast('No se pudo cifrar la copia.'); return; }
    } else texto = JSON.stringify({ app: 'mis-finanzas', version: 3, fecha: new Date().toISOString(), datos: datosCopia }, null, 2);
    const nombre = 'mis-finanzas.json';
    const listo = () => { lsSet('ultima_copia', Date.now()); estadoCopia(); if (!$('#sheet').hidden && $('#sheet-box .sheet-head h2') && $('#sheet-box .sheet-head h2').textContent === 'Ajustes y copia') sheetAjustes(); toast('Copia guardada'); };
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
    if (dl) {
      try { await dl.save({ filename: nombre, data: texto }); listo(); }
      catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? 'Ya hay una descarga esperando tu confirmación.' : 'No se pudo guardar la copia en esta vista.'); }
      return;
    }
    const tactil = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (tactil && navigator.canShare) {
      try {
        const archivo = new File([texto], nombre, { type: 'application/json' });
        if (navigator.canShare({ files: [archivo] })) { await navigator.share({ files: [archivo] }); listo(); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try {
      const url = URL.createObjectURL(new Blob([texto], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); listo();
    } catch (e) { toast('No se pudo guardar la copia.'); }
  }

    if (!(inp.matches && inp.matches('input.abono'))) return;
    const p = S.prestamos.find((x) => x.id === prestAbierto); if (!p) return;
    const v = parseMonto(inp.value);
    inp.value = v > 0 ? fmtNum(v) : '';
    const extras = { ...p.extras };
    if (v > 0) extras[inp.dataset.m] = Math.round(v * 100) / 100; else delete extras[inp.dataset.m];
    p.extras = extras;
    guardar(); actualizarDetalle();
  });
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VISTAS[v] && v !== vista) { vista = v; prestAbierto = null; render(); } });

  // ================= Inicio =================
  const estadoIni = cargar();
  const h = location.hash.slice(1);
  if (VISTAS[h]) vista = h;
  if (cifradoOk) revisarBio().then(() => { if (estadoIni === 'bloqueada') mostrarLock(); });
  else if (estadoIni === 'bloqueada') mostrarLock();
  if (estadoIni !== 'bloqueada') { render(); snapDiario(); }
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
